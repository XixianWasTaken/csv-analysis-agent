[project]
name = "csv-analysis-agent"
version = "0.1.0"
description = "Local CSV analysis with LangGraph and isolated Python execution"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/csv_agent/_vendor/LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = [
  "httpx>=0.28,<0.29",
  "langgraph>=1.0,<2",
  "pandas>=2.2,<4",
  "pillow>=12,<14",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "streamlit>=1.45,<2",
]

[project.urls]
Repository = "https://github.com/XixianWasTaken/csv-analysis-agent"
Issues = "https://github.com/XixianWasTaken/csv-analysis-agent/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "mypy>=1.15,<2", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csv_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires the prepared Docker image and daemon", "live: uses real model credits"]

[tool.mypy]
strict = true
# Keep the pinned upstream function bodies intact; application code stays strict.
untyped_calls_exclude = ["csv_agent._vendor.dabench"]
files = ["src/csv_agent", "app.py"]
[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = ["csv_agent._vendor.dabench"]
ignore_errors = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# The vendor file is checksum-locked and kept verbatim.
"src/csv_agent/_vendor/dabench.py" = ["ALL"]
